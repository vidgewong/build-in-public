# 登录接口的限流桶。zone 指令必须在 http 作用域，所以放在 server 块外面。
# 10m 能存约 16 万个 IP，对一个个人站绰绰有余。
limit_req_zone $binary_remote_addr zone=bip_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name open.vidge.me;

    # 证书是 *.vidge.me 泛域名，open 子域直接覆盖，不用单独签
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name open.vidge.me;

    ssl_certificate     /home/vidge/.acme.sh/*.vidge.me_ecc/fullchain.cer;
    ssl_certificate_key /home/vidge/.acme.sh/*.vidge.me_ecc/*.vidge.me.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/open.vidge.me;
    index index.html;

    access_log /var/log/nginx/open.vidge.me.access.log;
    error_log  /var/log/nginx/open.vidge.me.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带 hash 的构建产物可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 登录是唯一能被暴力猜的入口，单独限流。
    # 服务端自己也有 5 次锁 15 分钟，但那是按 IP 存内存的，重启就清空；
    # nginx 这层挡在前面，省得请求打到 node 上做 scrypt（故意很慢）。
    location = /api/admin/login {
        limit_req zone=bip_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # API 反代给本机的 node 进程。snapshot 自己带 cache-control，这里不额外加
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # 前端是 BrowserRouter，所有未命中的路径都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不能缓存，否则改版后客户端拿不到新的 assets 引用
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
